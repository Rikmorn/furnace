[workspace]
resolver = "2"
members = ["furnace-cli", "furnace-runtime"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
wry = "0.55"
